# Worker Pod 出站 NetworkPolicy（ticket 07 生产形态，ticket 30 应用为真实白名单）
# 核心：默认拒绝任意出站 + 仅放行 DNS 与模型 API。
# 注意：模型 API 地址为本机 DNS 解析出的 llms.litta.cn IP（198.18.2.74，本开发机为本地代理拦截段）；
#       生产环境替换为真实 AI 网关出口（或集群内自建网关 → 用 namespaceSelector 指向网关命名空间）。
# 存储流量（per-user PVC）在 K8s 内部不走 CNI egress 规则，无需放行。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: poweri
spec:
  podSelector:
    matchLabels:
      app: poweri
      role: worker
  policyTypes:
    - Egress
  egress:
    # 模型 API 白名单（llms.litta.cn 内网 IP；生产按真实网关替换）
    - to:
        - ipBlock:
            cidr: 172.16.123.89/32
      ports:
        - protocol: TCP
          port: 443
    # 允许 DNS（解析模型域名必需，kube-dns 在 kube-system）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
