apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poweri-worker-alice
  namespace: poweri
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker-alice }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
