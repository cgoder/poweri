# PowerI-Web K8s 部署（自描述 manifest，monorepo web/ 自持；ticket 10 部署闭环归位）
# 由 PowerI 控制面 gen-k8s 聚合部署（注入 ${WEB_IMAGE}/${WEB_USERS}/${GW_USERS}；Secret 由控制面创建，不进 manifest）
# 网关模式：POWERI_GATEWAY_URL 存在即启用（数据全在 worker 侧，无 PVC）；无配置时行为与上游一致（保底回退）
# 探针：全站 Basic Auth（无认证连接被重置）→ exec probe 取第一个账号认证，<500 即就绪
apiVersion: apps/v1
kind: Deployment
metadata: { name: poweri-web, namespace: poweri }
spec:
  replicas: 1
  selector: { matchLabels: { app: poweri, role: ui } }
  template:
    metadata: { labels: { app: poweri, role: ui } }
    spec:
      containers:
        - name: poweri-web
          image: ${WEB_IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 30141 }]
          env:
            - { name: POWERI_GATEWAY_URL, value: http://gateway.poweri.svc.cluster.local:8080 }
            - { name: POWERI_GATEWAY_CWD, value: /workspace }
            - { name: POWERI_WEB_USERS, value: "${WEB_USERS}" }
            - { name: POWERI_GATEWAY_USERS, value: "${GW_USERS}" }
            - name: POWERI_GATEWAY_TOKEN
              valueFrom: { secretKeyRef: { name: poweri-secrets, key: POWERI_UI_TOKEN } }
            - name: POWERI_WEB_PASSWORD
              valueFrom: { secretKeyRef: { name: poweri-secrets, key: POWERI_WEB_PASSWORD } }
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const u=process.env.POWERI_WEB_USERS.split(';')[0];const i=u.indexOf(':');const us=u.slice(0,i),pw=u.slice(i+1);fetch('http://127.0.0.1:30141/',{headers:{Authorization:'Basic '+Buffer.from(us+':'+pw).toString('base64')}}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const u=process.env.POWERI_WEB_USERS.split(';')[0];const i=u.indexOf(':');const us=u.slice(0,i),pw=u.slice(i+1);fetch('http://127.0.0.1:30141/',{headers:{Authorization:'Basic '+Buffer.from(us+':'+pw).toString('base64')}}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata: { name: poweri-web, namespace: poweri }
spec:
  type: NodePort
  selector: { app: poweri, role: ui }
  ports:
    - { port: 30141, targetPort: 30141, nodePort: 30341 }
